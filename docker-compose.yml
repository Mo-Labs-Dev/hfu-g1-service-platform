
services:
  postgres:
    image: postgres:17-alpine
    container_name: g1-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: g1user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: g1studio

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - g1_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g1user -d g1studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  g1_postgres_data:
